flag_for_review:
  # Quasi-identifiers (optional alternative): a whole group implicated without names.
  - id: flag.group_inference
    scope: sentence
    pattern: '(?i)\b(?:all|both|each of the|every one of the|the entire)\s+(?:\w+\s+){0,2}(?:analysts|traders|employees|members|partners|directors|staff|nurses|physicians|associates)\s+(?:on|of|at|in)\s+the\s+(?:\w+\s+){0,3}(?:desk|team|office|group|branch|unit|ward|department)\b'
    replacement: Several employees in one team were affected.
    reason: The sentence implicates every member of a small, named group — each of them is identifiable without a name.
  # Release & rights 4.2: anonymizing does not cure privilege or client confidentiality.
  - id: rights.privileged
    scope: sentence
    pattern: '(?i)\b(?:attorney[- ]client|privileged(?: (?:and|&) confidential)?|work product|we (?:recommend|advise) (?:that the client )?settl\w*|(?:the |our )?client[’'']s exposure|under (?:the |a )?NDA|subject to (?:a |the )?non-disclosure|protected health information|patient (?:record|chart)s?)\b'
    replacement: "[Withheld: possibly privileged or client-confidential]"
    reason: >-
      Possibly privileged or client-confidential. Anonymizing doesn't cure it — a lawyer can't waive the
      client's confidentiality. Keep only if the rights holder consented (and say so); otherwise withhold.

# Quasi-identifier combinations (2.1 rare profile, 2.2 unique role + place + event): a sentence that
# combines several of these attributes goes to the review queue, even with every name removed.
quasi_identifiers:
  min_categories: 3
  categories:
    age: ['\b\d{1,3}[- ]year[- ]old\b', '\bage[sd]?\s+\d{1,3}\b', ',\s+\d{2},\s+(?:of|from)\b', '\bin (?:his|her|their) (?:20|30|40|50|60|70|80)s\b']
    sex: ['\b(?:woman|man|female|male|mother|father|widow(?:er)?|girl|boy)\b']
    role: ['(?i)\b(?:CEO|CFO|COO|CCO|CIO|CTO|chief \w+ officer|general counsel|managing (?:partner|director)|portfolio manager|head of \w+|plant manager|founder|chair(?:man|woman)?|president|treasurer|controller|analyst|trader|compliance officer|nurse|surgeon|physician)\b']
    # Places come mainly from the language model's location tags; these add facilities and "in Boise"-style phrases.
    place: ['\b(?:in|at|near)\s+(?:our\s+)?[A-Z][a-z]+(?:\s[A-Z][a-z]+)?(?=\s+(?:clinic|hospital|office|branch|plant|facility|campus|desk)\b|,\s+[A-Z][a-z]+\b)', '(?i)\b(?:clinic|hospital|campus|plant|facility)\b']
    time: ['\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]*\.?\s+(?:\d{1,2},\s+)?(?:19|20)\d{2}\b', '\b(?:19|20)\d{2}\b', '(?i)\b(?:two|three|\d+)\s+(?:days|weeks|months)\s+(?:after|before)\b']
    event: ['(?i)\b(?:resigned|terminated|fired|dismissed|left the|retired|promoted|indicted|charged|arrested|convicted|settled|sued|exam(?:ination)?|investigation|diagnosed|treated|hospitali[sz]ed|died|placed on leave|put on leave|whistleblow\w*)\b']
    health: ['(?i)\b(?:syndrome|disease|disorder|cancer|tumou?r|lymphoma|diagnos\w+|patient|condition|rare genetic|pregnan\w+|HIV|diabetes)\b']
    size: ['(?i)\$\s?\d+(?:\.\d+)?\s?(?:B|M|bn|billion|million)\b', '(?i)\b\d+(?:\.\d+)?\s?(?:M|million|thousand|k)\s+(?:customers|users|employees|patients|subscribers)\b', '(?i)\bnationwide|largest|only\b']
