# General rules merged into EVERY policy pack (finance, legal, life sciences …).
# Vertical packs add to these lists; files starting with "_" are not offered as packs.
# Edge-case numbers refer to "Anonymization Edge Cases — Longitude Labs" (Oct 14, 2026).

name: _base

settings:
  date_mode: month_year          # month_year | shifted | relative | exact   (edge case 2.3)
  public_companies: review       # review | keep | redact                      (edge case 1.1)

entities:
  URL:
    title: Websites and domains
    action: redact
    label: "Website {1}"
    rule: always_redact.websites
    reason: A company's own website or domain names it.
    auto: true
  MONEY:
    title: Headline figures → rounded
    action: generalize
    label: "Amount {1}"
    rule: generalize.figures
    reason: Exact headline amounts are searchable in public releases; they are rounded, never noised.
    auto: true
  SHARE_COUNT:
    title: Share counts → rounded
    action: generalize
    label: "Shares {1}"
    rule: generalize.figures
    reason: Exact share counts are searchable in public releases; they are rounded, never noised.
    auto: true

recognizers:
  - entity: MONEY
    score: 0.9
    patterns:
      # $4.75M · $68.7 billion · $750,000 · $95.00 per share   (tiny amounts like par values are skipped)
      - '(?P<v>\$\s?\d{1,3}(?:,\d{3})+(?:\.\d+)?(?:\s?(?:million|billion|thousand|[MBK]|bn|mm)\b)?|\$\s?\d+(?:\.\d+)?\s?(?:million|billion|thousand|[MBK]|bn|mm)\b|\$\s?\d{2,}(?:\.\d+)?(?=\s+per\s+share))'
  - entity: SHARE_COUNT
    score: 0.9
    patterns:
      - '(?P<v>\b\d{1,3}(?:,\d{3})+(?:\s+(?:million|billion))?\s+(?:shares|units|contracts|options))\b'

keep_list:
  terms:
    - Press Release
    - Investor Presentation
    - IRS
    - Internal Revenue Service
  patterns:
    # 1.2 Technical eponyms: "Kaplan-Meier curve", "Black-Scholes value", "Hodgkin lymphoma"
    - '\b[A-Z][a-z]+(?:[-–][A-Z][a-z]+)+\s+(?:curve|estimator|model|method|test|formula|equation|value|option|options|distribution|index|ratio|plot|criterion|transform|theorem|algorithm|analysis|framework)\b'
    - '\b[A-Z][a-z]+(?:[-–][A-Z][a-z]+)*(?:’s|''s)?\s+(?:disease|syndrome|lymphoma|sarcoma|palsy|anomaly|reflex|law)\b'
    - '\b(?:Monte Carlo|Black-Scholes(?:-Merton)?|Kaplan-Meier|Fama-French|Cox (?:proportional|regression)|Sharpe ratio|Gini coefficient|Nash equilibrium|Pareto (?:optimal|efficient|principle)|Bayes(?:ian)?|Gaussian|Poisson|Bonferroni|Wilcoxon|Mann-Whitney|Kruskal-Wallis|Markowitz|Phillips curve|Laffer curve|Hodgkin(?:’s|''s)?)\b'
    # Generic document furniture
    - '\b(?:Exhibit|Item|Schedule|Annex|Appendix)\s+\d+(?:\.\d+)*[A-Z]?\b'

# Words detectors confuse with names, in any vertical.
not_entities: [Press Release, Investor Presentation, Exhibit, Exhibits, Item, Schedule, Annex, Appendix, Form,
               Section, Rule, Act, Agreement, Registrant, Report, Current Report, Annual Report, Signatures,
               Media Relations, Investor Relations, Overview, Summary, Background, Introduction, Conclusion,
               State, Commission File, Zip Code, Emerging Growth Company, Common Stock, Notes]

# Headline verbs and glue words that detectors attach to company names ("Microsoft Announces Partnership").
name_noise_words: [announces, announced, reports, reported, launches, launched, acquires, acquired, completes,
                   completed, enters, entered, signs, signed, unveils, names, appoints, files, filed, agrees,
                   agreed, to, with, for, "on", at, as, by, partnership, agreement, acquisition, merger, deal,
                   today, statement, update, issues, issued]

# Release & rights 4.3: a first name used alone may be a nickname of someone already in the registry.
